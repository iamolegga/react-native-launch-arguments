name: Detox E2E Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS E2E
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json

      - name: Install root dependencies
        run: npm install

      - name: Build and pack library
        run: |
          npm run build
          npm pack
          VERSION=$(node -p "require('./package.json').version")
          mv "react-native-launch-arguments-${VERSION}.tgz" "example/react-native-launch-arguments-${VERSION}.tgz"

      - name: Install example dependencies
        working-directory: example
        run: |
          VERSION=$(node -p "require('../package.json').version")
          npm install "./react-native-launch-arguments-${VERSION}.tgz" --legacy-peer-deps

      - name: Install applesimutils
        run: |
          brew tap wix/brew
          brew install applesimutils
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ~/.cocoapods
          key: cocoapods-${{ runner.os }}

      - name: Build iOS app
        working-directory: example
        run: npx detox build -c ios.ci

      - name: Test iOS
        working-directory: example
        run: npx detox test -c ios.ci --headless --cleanup

      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detox-ios-artifacts
          path: example/artifacts/
          retention-days: 7

  android:
    name: Android E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_LEVEL: 34
      ARCH: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install root dependencies
        run: npm ci

      - name: Build and pack library
        run: |
          npm run build
          npm pack
          VERSION=$(node -p "require('./package.json').version")
          mv "react-native-launch-arguments-${VERSION}.tgz" "example/react-native-launch-arguments-${VERSION}.tgz"

      - name: Install example dependencies
        working-directory: example
        run: |
          VERSION=$(node -p "require('../package.json').version")
          npm install "./react-native-launch-arguments-${VERSION}.tgz" --legacy-peer-deps

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: ${{ env.ARCH }}
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          force-avd-creation: false
          script: echo 'Generated AVD snapshot for caching.'

      - name: Build Android app
        working-directory: example
        run: npx detox build -c android.ci

      - name: Test Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: ${{ env.ARCH }}
          avd-name: test
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          force-avd-creation: false
          script: cd example && npx detox test -c android.ci --headless

      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detox-android-artifacts
          path: example/artifacts/
          retention-days: 7
